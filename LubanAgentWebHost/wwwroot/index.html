<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="yswenli" />
    <!-- 首屏语言：与 src/i18n/index.ts 的 normalizeLocale 保持一致（键 luban.web.locale）。
         先按本地缓存，其次按浏览器语言匹配 14 种受支持语言，都命中不了按简体中文。 -->
    <script>
      (function () {
        var supported = [
          'en',
          'az',
          'es',
          'id',
          'it',
          'ja',
          'ko',
          'pt',
          'pl',
          'ru',
          'th',
          'tr',
          'zh-CN',
          'zh-TW',
        ];
        function normalize(value) {
          var raw = (value || '').trim().replace('_', '-');
          if (!raw) return null;
          if (/^zh/i.test(raw)) {
            return /hant|tw|hk|mo/i.test(raw) ? 'zh-TW' : 'zh-CN';
          }
          var base = raw.split('-')[0].toLowerCase();
          return supported.indexOf(base) >= 0 ? base : null;
        }
        var cached = null;
        try {
          cached = normalize(localStorage.getItem('luban.web.locale'));
        } catch (e) {
          /* 隐私模式下读不到，走浏览器语言 */
        }
        var locale = cached;
        if (!locale) {
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < list.length && !locale; i += 1) {
            locale = normalize(list[i]);
          }
        }
        document.documentElement.lang = locale || 'zh-CN';
      })();
    </script>
    <!-- 首屏防闪：必须在样式表与首绘之前写 data-theme。
         解析规则与 src/lib/theme.ts 一致（键 luban.web.theme，三态 follow/dark/light），改键名时两处同步。 -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          /* matchMedia 不可用时按浅色 */
        }
        var preference = 'follow';
        try {
          preference = localStorage.getItem('luban.web.theme') || 'follow';
        } catch (e) {
          /* 隐私模式下读不到，按跟随系统 */
        }
        var mode =
          preference === 'dark' ? 'dark' : preference === 'light' ? 'light' : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <!-- 站点图标：源文件放在 src/asserts，构建时由 Vite 作为静态资源产出并改写成本地相对地址 -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon-zGx7FaNL.ico" />
    <title>LuBan Agent</title>
    <!-- 由 WebHost 启动时生成（只含用户与端口）；开发模式下可能 404，前端按空配置运行 -->
    <script src="./runtime-config.js"></script>
    <script type="module" crossorigin src="./assets/index-BzEtHQqb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Oc6O6FTS.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
