<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="yswenli" />
    <!-- 首屏防闪：必须在样式表与首绘之前写 data-theme。
         解析规则与 src/lib/theme.ts 一致（键 luban.web.theme，三态 follow/dark/light），改键名时两处同步。 -->
    <script>
      (function () {
        var dark = false;
        try {
          dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          /* matchMedia 不可用时按浅色 */
        }
        var preference = 'follow';
        try {
          preference = localStorage.getItem('luban.web.theme') || 'follow';
        } catch (e) {
          /* 隐私模式下读不到，按跟随系统 */
        }
        var mode =
          preference === 'dark' ? 'dark' : preference === 'light' ? 'light' : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <!-- 站点图标：源文件放在 src/asserts，构建时由 Vite 作为静态资源产出并改写成本地相对地址 -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon-zGx7FaNL.ico" />
    <title>LuBan Agent</title>
    <!-- 由 WebHost 启动时生成（只含用户与端口）；开发模式下可能 404，前端按空配置运行 -->
    <script src="./runtime-config.js"></script>
    <script type="module" crossorigin src="./assets/index-DOlnCqYp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-eck0c9rD.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
